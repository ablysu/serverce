<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#39ff14',
                        neonMagenta: '#ff00ff',
                        darkBase: '#0a0a0a',
                        darkCard: '#1a1a1a',
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'scan': 'scan 6s linear infinite',
                        'bounce-slow': 'bounce 2s infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 10px theme(colors.neonGreen), 0 0 20px theme(colors.neonGreen)' },
                            '100%': { boxShadow: '0 0 20px theme(colors.neonGreen), 0 0 40px theme(colors.neonGreen), 0 0 60px theme(colors.neonMagenta)' },
                        },
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient-dual {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-image: linear-gradient(45deg, #39ff14, #ff00ff, #39ff14);
            }
            .bg-grid-tech {
                background-image: 
                    linear-gradient(rgba(57, 255, 20, 0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(57, 255, 20, 0.08) 1px, transparent 1px);
                background-size: 25px 25px;
            }
        }
    </style>
</head>
<body class="bg-darkBase bg-grid-tech min-h-screen text-white font-sans overflow-x-hidden relative">

            </div>
            <div class="text-center text-xl font-mono py-4 bg-darkBase/50 rounded-xl border border-gray-700 mb-4">
                18566077075
            </div>

        </div>
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-md">
            <a href="weixin://dl/chat?18566077075" class="flex-1 bg-gradient-to-r from-neonGreen to-neonGreen/70 rounded-full px-6 py-4 text-lg font-bold text-darkBase text-center animate-glow">
                <i class="fa fa-external-link mr-2"></i>跳转微信
            </a>
            <a href="index.html" class="flex-1 bg-darkCard/80 border border-gray-700 rounded-full px-6 py-4 text-lg font-bold text-white text-center hover:border-neonMagenta/50 transition-colors duration-300">

            </a>
        </div>
    </div>
    <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-neonMagenta via-neonGreen to-neonMagenta"></div>
</body>
</html>
