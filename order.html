<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立即下单 | 选择服务类型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#39ff14',
                        neonMagenta: '#ff00ff',
                        darkBase: '#0a0a0a',
                        darkCard: '#1a1a1a',
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'scan': 'scan 6s linear infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 10px theme(colors.neonGreen), 0 0 20px theme(colors.neonGreen)' },
                            '100%': { boxShadow: '0 0 20px theme(colors.neonGreen), 0 0 40px theme(colors.neonGreen), 0 0 60px theme(colors.neonMagenta)' },
                        },
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient-dual {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-image: linear-gradient(45deg, #39ff14, #ff00ff, #39ff14);
            }
            .bg-grid-tech {
                background-image: 
                    linear-gradient(rgba(57, 255, 20, 0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(57, 255, 20, 0.08) 1px, transparent 1px);
                background-size: 25px 25px;
            }
            .border-glow-green {
                box-shadow: 0 0 10px theme(colors.neonGreen);
            }
            .radio-checked {
                border-color: #39ff14 !important;
                background-color: rgba(57, 255, 20, 0.2) !important;
            }
        }
    </style>
</head>
<body class="bg-darkBase bg-grid-tech min-h-screen text-white font-sans overflow-x-hidden relative">
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-neonGreen via-neonMagenta to-neonGreen"></div>
    <div class="absolute inset-0 bg-gradient(0deg, rgba(255, 0, 255, 0.05) 1px, transparent 1px) bg-[length:100%_5px] animate-scan pointer-events-none"></div>
    <div class="container mx-auto px-6 py-16 relative z-10">
        <div class="text-center mb-16">
            <h1 class="text-[clamp(2.5rem,10vw,4rem)] font-black mb-4 text-gradient-dual">选择服务类型</h1>
            <p class="text-gray-300 text-[clamp(0.9rem,2vw,1.1rem)]">选中后点击下单，自动复制客服微信</p>
        </div>
        <div class="bg-darkCard/80 backdrop-blur-sm rounded-2xl p-8 mb-16 border border-gray-700">
            <form id="orderForm">
                <div class="space-y-5">
                    <label class="block p-5 rounded-xl border border-gray-600 transition-all duration-300 cursor-pointer hover:border-neonGreen/50" for="service1">
                        <div class="flex items-center">
                            <input type="radio" id="service1" name="service" value="电脑维修" class="w-5 h-5 text-neonGreen accent-neonGreen">
                            <div class="ml-4">
                                <h3 class="text-xl font-bold text-white">电脑维修</h3>
                                <p class="text-gray-400 text-sm">专业检测 · 快速修复 · 当场解决</p>
                            </div>
                        </div>
                    </label>
                    <label class="block p-5 rounded-xl border border-gray-600 transition-all duration-300 cursor-pointer hover:border-neonMagenta/50" for="service2">
                        <div class="flex items-center">
                            <input type="radio" id="service2" name="service" value="系统安装" class="w-5 h-5 text-neonMagenta accent-neonMagenta">
                            <div class="ml-4">
                                <h3 class="text-xl font-bold text-white">系统安装</h3>
                                <p class="text-gray-400 text-sm">纯净系统 · 驱动齐全 · 安全稳定</p>
                            </div>
                        </div>
                    </label>
                    <label class="block p-5 rounded-xl border border-gray-600 transition-all duration-300 cursor-pointer hover:border-neonGreen/50" for="service3">
                        <div class="flex items-center">
                            <input type="radio" id="service3" name="service" value="游戏陪玩" class="w-5 h-5 text-neonGreen accent-neonGreen">
                            <div class="ml-4">
                                <h3 class="text-xl font-bold text-white">游戏陪玩</h3>
                                <p class="text-gray-400 text-sm">大神带飞 · 欢乐开黑 · 多种游戏</p>
                            </div>
                        </div>
                    </label>
                    <label class="block p-5 rounded-xl border border-gray-600 transition-all duration-300 cursor-pointer hover:border-neonMagenta/50" for="service4">
                        <div class="flex items-center">
                            <input type="radio" id="service4" name="service" value="工作陪跑" class="w-5 h-5 text-neonMagenta accent-neonMagenta">
                            <div class="ml-4">
                                <h3 class="text-xl font-bold text-white">工作陪跑</h3>
                                <p class="text-gray-400 text-sm">高效协作 · 助力完成 · 一对一服务</p>
                            </div>
                        </div>
                    </label>
                </div>
                <button type="button" id="orderBtn" class="w-full mt-10 bg-gradient-to-r from-neonGreen to-neonGreen/70 rounded-full px-8 py-6 text-xl font-bold text-darkBase text-center animate-glow border-glow-green">
                    <i class="fa fa-shopping-cart mr-2"></i>点击下单（自动复制微信）
                </button>
                <div id="copyTip" class="text-center mt-4 text-neonGreen text-sm hidden">
                    <i class="fa fa-check-circle mr-1"></i>客服微信已复制，请添加后人工报价~
                </div>
            </form>
        </div>
        <div class="text-center">
            <a href="index.html" class="inline-block text-gray-400 hover:text-neonGreen transition-colors duration-300">
                <i class="fa fa-arrow-left mr-2"></i>返回首页
            </a>
        </div>
    </div>
    <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-neonMagenta via-neonGreen to-neonMagenta"></div>
    <script>
        const wechatNumber = "18566077075";
        const radios = document.querySelectorAll('input[name="service"]');
        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('label').forEach(label => label.classList.remove('radio-checked'));
                this.closest('label').classList.add('radio-checked');
            });
        });
        document.getElementById('orderBtn').addEventListener('click', function() {
            const checkedRadio = document.querySelector('input[name="service"]:checked');
            if (!checkedRadio) {
                alert('请先选择需要的服务类型~');
                return;
            }
            navigator.clipboard.writeText(wechatNumber).then(() => {
                window.location.href = "order-success.html";
            }).catch(err => {
                alert('复制失败，请手动输入微信：' + wechatNumber);
            });
        });
    </script>
</body>
</html>
